version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documentworm-postgres
    restart: always
    environment:
      POSTGRES_DB: documentworm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - documentworm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d documentworm_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  documentworm_pgdata:
